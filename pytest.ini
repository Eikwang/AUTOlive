[pytest]
# Test paths
testpaths = tests

# Test file patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v 
    --tb=short 
    --strict-markers 
    --strict-config
    --durations=10
    --durations-min=0.1

# Markers
markers =
    slow: Mark test as slow running
    integration: Integration test
    unit: Unit test
    database: Database related test
    config: Configuration related test
    async_test: Async test
    performance: Performance test

# Log configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warning filters
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning