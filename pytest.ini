[pytest]
# Test paths
testpaths = tests

# Test file patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --strict-config
    --durations=10
    --durations-min=0.1
    --timeout=180
    --timeout_method=thread
# timeout（2026-11-07 挂死防御）：test_rvc_rc_integration 全量实跑 35 分钟卡 5%
# ——GPU 门 patch 脱链致真实显存判定泄漏，_stop.wait(30) 无限循环。thread 方法
# 兜底任何测试挂死（Windows 无 signal）；超时=FAIL+栈 dump，不再无限等。

# Markers
markers =
    slow: Mark test as slow running
    integration: Integration test
    unit: Unit test
    database: Database related test
    config: Configuration related test
    async_test: Async test
    performance: Performance test

# Log configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warning filters
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning