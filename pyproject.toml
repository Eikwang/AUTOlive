[project]
name = "luna-ai"
version = "1.0.0"
description = "Luna AI - 一站式 AI 虚拟主播解决方案"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

[tool.ruff]
# 行宽限制
line-length = 120
# 目标 Python 版本
target-version = "py310"

[tool.ruff.lint]
# 启用规则集
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff specific
]
ignore = [
    "E501",   # 行过长（由格式化工具处理）
    "B008",   # 函数参数中的函数调用
    "SIM108", # 三元表达式（可读性差）
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # 允许 __init__.py 中的未使用导入

[tool.ruff.format]
# 格式化配置
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
